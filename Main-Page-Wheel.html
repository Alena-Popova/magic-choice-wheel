<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Книжная Рулетка</title>
    <link rel="icon" href="./assets/book-club/shells.svg" type="image/svg+xml">
    <link href="https://fonts-online.ru/fonts/unifix-sp" rel="stylesheet">
    <style>
        @font-face {
          font-family: 'UnifixSP';
          src: url('./UnifixSP/UnifixSPDemo.otf') format('opentype');
          font-weight: 400;
          font-style: normal;
        }

        :root {
          --background: #e8edef;
          --primary-light: #5393fb;
          --primary: #5393fb;
          --color-text-light: #ffffff;
          --primary-dark: #5393fb;
          --color-text-dark: #8c909d;
          --color-text-shell: #2b211f;
          --color-gray-shell: #2b211f;
          --color-light-violet: #5b71ff;
          --color-deep-violet: #2b42d4;
          --wheel-background-image: none;
          --spin-duration: 5000ms;
        }

        * {
          box-sizing: border-box;
        }

        html,
        body {
          height: 100%;
        }

        body {
          margin: 0;
          background: var(--background);
          font-family: 'UnifixSP', sans-serif;
        }

        .page {
          display: block;
          align-items: center;
        }

        .title {
          margin: 20px;
          margin-bottom: 60px;
          text-align: center;
          font-size: 2rem;
        }

        .title-primary {
          color: var(--color-deep-violet);
        }

        .title-secondary {
          color: var(--color-light-violet);
        }

        .wrapper {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 2rem;
          padding-top: 2rem;
          user-select: none;
        }

        #rouletteContainer {
          position: relative;
          width: 600px;
          height: 600px;
          margin: 0 auto;
          overflow: visible;
          border: 3px solid var(--color-light-violet);
          border-radius: 50%;
          background-image: var(--wheel-background-image);
          background-position: center;
          background-repeat: no-repeat;
          background-size: cover;
        }

        #rouletteContainer::before {
          content: '';
          position: absolute;
          inset: -12px;
          border: 3px solid var(--color-light-violet);
          border-radius: 50%;
          pointer-events: none;
        }

        #wheel {
          position: relative;
          width: 100%;
          height: 100%;
          border-radius: 50%;
          transition: transform var(--spin-duration) cubic-bezier(0.33, 1, 0.68, 1);
          will-change: transform;
        }

        .sector-label {
          position: absolute;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
          color: var(--color-deep-violet);
          pointer-events: none;
          text-align: center;
          transform-origin: center center;
          user-select: none;
        }

        .sector-label-name {
          font-size: 1.25rem;
          font-weight: bold;
          line-height: 1.4;
          text-orientation: mixed;
          white-space: pre;
          writing-mode: vertical-lr;
        }

        .sector-label-icon {
          font-size: 1.6rem;
          line-height: 1;
        }

        .sector-label-image {
          width: 36px;
          height: 36px;
          border: 2px solid rgba(43, 66, 212, 0.2);
          border-radius: 50%;
          object-fit: cover;
        }

        #arrow {
          position: absolute;
          top: -70px;
          left: 50%;
          width: 0;
          height: 0;
          margin-left: -50px;
          z-index: 10;
        }

        #arrow img {
          width: 100px;
          height: 100px;
          cursor: pointer;
        }

        .side-panel {
          display: flex;
          flex: 1 1 30%;
          flex-direction: column;
          gap: 1rem;
          justify-content: flex-start;
          align-items: center;
          max-width: 400px;
          min-width: 320px;
          margin: 2rem auto;
        }

        #sideIcons {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 8px;
          width: 100%;
        }

        .side-icon {
          width: 200px;
          max-width: calc(50% - 4px);
        }

        #nameInput {
          width: 408px;
          max-width: 100%;
          height: 150px;
          margin-bottom: 1.5rem;
          padding: 1rem;
          resize: none;
          border: 3px solid var(--color-light-violet);
          border-radius: 10px;
          background: var(--background);
          color: var(--color-text-shell);
          font-family: 'UnifixSP', sans-serif;
          font-size: 1rem;
        }

        #spinBtn {
          position: relative;
          z-index: 0;
          width: 100%;
          padding: 1rem 2rem;
          overflow: visible;
          border: none;
          border-radius: 12px;
          background: var(--color-light-violet);
          color: var(--background);
          cursor: pointer;
          font-family: 'UnifixSP', sans-serif;
          font-size: 1.5rem;
          transition: transform 0.2s ease, box-shadow 0.3s ease;
          user-select: none;
        }

        #spinBtn:hover {
          transform: scale(1.05);
        }

        #spinBtn:active {
          transform: scale(0.95);
        }

        .btn-firework {
          position: absolute;
          z-index: 10;
          border-radius: 50%;
          background-color: var(--primary-dark);
          animation: btnExplode 800ms ease-out forwards;
          opacity: 1;
          pointer-events: none;
          will-change: transform, opacity;
        }

        @keyframes btnExplode {
          0% {
            transform: scale(1);
            opacity: 1;
          }
          100% {
            transform: scale(3) translate(var(--tx), var(--ty));
            opacity: 0;
          }
        }

        .firework {
          position: fixed;
          z-index: 9999;
          border-radius: 50%;
          animation: explode 1s ease-out forwards;
          opacity: 1;
          pointer-events: none;
          will-change: transform, opacity;
        }

        @keyframes explode {
          0% {
            transform: scale(1);
            opacity: 1;
          }
          100% {
            transform: scale(20) translate(var(--tx), var(--ty));
            opacity: 0;
          }
        }

        .modal {
          position: fixed;
          top: 0;
          left: 0;
          display: none;
          z-index: 9999;
          width: 100%;
          height: 100%;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          background: rgba(0, 0, 0, 0.9);
        }

        .modal h2 {
          margin-bottom: 1rem;
          color: var(--color-text-dark);
          font-size: 3rem;
        }

        .modal img {
          width: 400px;
          max-width: 90%;
          height: auto;
          border: 5px solid var(--color-text-dark);
          border-radius: 15px;
        }

        .fatal-error {
          max-width: 700px;
          margin: 10vh auto;
          padding: 24px;
          border: 3px solid var(--color-light-violet);
          border-radius: 20px;
          background: rgba(255, 255, 255, 0.8);
          color: var(--color-deep-violet);
          text-align: center;
          line-height: 1.5;
        }

        .fatal-error code {
          display: inline-block;
          margin-top: 8px;
          padding: 4px 8px;
          border-radius: 8px;
          background: rgba(91, 113, 255, 0.12);
        }

        @media (max-width: 768px) {
          .wrapper {
            flex-direction: column;
            align-items: center;
          }

          #rouletteContainer,
          .side-panel {
            width: 100%;
            max-width: 100%;
          }

          #rouletteContainer {
            width: 90vw;
            height: 90vw;
          }

          .sector-label-name {
            font-size: 1rem;
          }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="title">
        <div class="title-primary" id="pageTitlePrimary"></div>
        <div class="title-secondary" id="pageTitleSecondary"></div>
    </div>
    <div class="wrapper">
        <div id="rouletteContainer">
            <div id="arrow">
                <img id="reloadWheel" src="" alt="Обновить колесо">
            </div>
            <div id="wheel"></div>
        </div>
        <div class="side-panel">
            <div id="sideIcons"></div>
            <textarea id="nameInput"></textarea>
            <button id="spinBtn" type="button"></button>
        </div>
    </div>
    <div class="modal" id="winnerModal">
        <h2 id="winnerName"></h2>
        <img id="winnerGif" src="" alt="Картинка победителя">
    </div>
    <div class="modal" id="emptyModal">
        <h2 id="emptyModalTitle"></h2>
    </div>
    <audio id="spinSound" src="https://cdn.freesound.org/previews/59/59194_745228-lq.mp3"></audio>
</div>

<script>
    (function () {
      const DEFAULT_EMOJIS = [
        '📚', '📖', '🕮', '📜', '✒️', '🖋️', '📔', '📘', '📙', '📗',
        '📓', '📒', '📑', '🔖', '🪶', '🕯️', '☕', '🍵', '📎', '✉️',
        '💭', '🌙', '⭐', '🪄', '🧠', '💡', '🎇', '🪞', '🕰️', '🏛️',
        '🌿', '🍂', '🌸', '📇', '🗝️', '📦', '📷', '🎵', '🗒️'
      ];

      const DEFAULT_WINNER_IMAGES = Array.from(
        { length: 34 },
        (_, index) => `./gifs/${index + 1}.gif`
      );
      const DEBUG_PING_PATH = './debug-ping.txt';

      window.addEventListener('error', (event) => {
        debugLog('window-error', {
          message: event.message,
          source: event.filename,
          line: event.lineno,
          column: event.colno
        }, 'error');
      });

      window.addEventListener('unhandledrejection', (event) => {
        debugLog('unhandled-rejection', {
          reason: describeDebugValue(event.reason)
        }, 'error');
      });

      bootstrap();

      async function bootstrap() {
        try {
          const configPath = getConfigPath();
          debugLog('bootstrap-start', { configPath });
          const rawConfig = await loadJsonConfig(configPath);
          debugLog('config-loaded', {
            configPath,
            participantCount: Array.isArray(rawConfig.participants) ? rawConfig.participants.length : 0
          });
          startApp(rawConfig);
        } catch (error) {
          debugLog('bootstrap-error', {
            message: error instanceof Error ? error.message : String(error)
          }, 'error');
          showFatalError(error instanceof Error ? error.message : String(error));
        }
      }

      function getConfigPath() {
        const params = new URLSearchParams(window.location.search);
        return params.get('config') || './wheel-config.json';
      }

      async function loadJsonConfig(path) {
        if (window.location.protocol === 'file:') {
          throw new Error(
            'JSON-конфиг нельзя загрузить из file://. Открой страницу через локальный сервер, например: python3 -m http.server 8123'
          );
        }

        const response = await fetch(path, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Не удалось загрузить конфиг: ${path}`);
        }

        return response.json();
      }

      function showFatalError(message) {
        debugLog('fatal-error-shown', { message }, 'error');
        document.title = 'Ошибка конфигурации';
        document.body.innerHTML = `
          <div class="fatal-error">
            <h1>Конфиг не загрузился</h1>
            <div>${escapeHtml(message)}</div>
            <code>?config=wheel-config-study-session.json</code>
          </div>
        `;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function startApp(rawConfig) {
        const config = normalizeConfig(rawConfig);
        const participantDirectory = new Map(config.participants.map((participant) => [participant.name, participant]));

        const wheel = document.getElementById('wheel');
        const rouletteContainer = document.getElementById('rouletteContainer');
        const reloadWheel = document.getElementById('reloadWheel');
        const sideIcons = document.getElementById('sideIcons');
        const nameInput = document.getElementById('nameInput');
        const spinBtn = document.getElementById('spinBtn');
        const modal = document.getElementById('winnerModal');
        const emptyModal = document.getElementById('emptyModal');
        const emptyModalTitle = document.getElementById('emptyModalTitle');
        const winnerNameEl = document.getElementById('winnerName');
        const winnerGif = document.getElementById('winnerGif');
        const spinSound = document.getElementById('spinSound');
        const titlePrimary = document.getElementById('pageTitlePrimary');
        const titleSecondary = document.getElementById('pageTitleSecondary');

        let currentNames = [];
        let currentRotation = 0;
        let fixedAngleStep = 0;
        let isSpinning = false;
        let unusedWinnerImageIndexes = [];

        debugLog('app-started', {
          pageTitle: config.content.pageTitle,
          participantCount: config.participants.length,
          sideIconCount: config.assets.sideIcons.length
        });

        applyTheme(config.theme);
        applyStaticContent(config);
        updateWheel();

        spinBtn.addEventListener('click', () => {
          debugLog('spin-button-clicked', {
            namesInTextarea: getNamesFromInput().length,
            isSpinning
          });
          spinWheel();
        });
        reloadWheel.addEventListener('click', () => {
          debugLog('reload-wheel-clicked', {
            namesInTextarea: getNamesFromInput().length
          });
          updateWheel();
        });
        nameInput.addEventListener('input', updateWheel);
        modal.addEventListener('click', () => {
          debugLog('winner-modal-closed');
          modal.style.display = 'none';
        });
        emptyModal.addEventListener('click', () => {
          debugLog('empty-modal-closed');
          emptyModal.style.display = 'none';
        });
        window.addEventListener('resize', () => {
          if (currentNames.length) {
            renderLabels(currentNames);
          }
        });

        function applyTheme(theme) {
          const root = document.documentElement;
          root.style.setProperty('--background', theme.background);
          root.style.setProperty('--primary-light', theme.primaryLight);
          root.style.setProperty('--primary', theme.primary);
          root.style.setProperty('--primary-dark', theme.primaryDark);
          root.style.setProperty('--color-text-light', theme.textLight);
          root.style.setProperty('--color-text-dark', theme.textDark);
          root.style.setProperty('--color-text-shell', theme.textShell);
          root.style.setProperty('--color-gray-shell', theme.grayShell);
          root.style.setProperty('--color-light-violet', theme.accentLight);
          root.style.setProperty('--color-deep-violet', theme.accentDark);
          root.style.setProperty('--wheel-background-image', `url("${escapeUrl(config.assets.wheelBackgroundImage)}")`);
          root.style.setProperty('--spin-duration', `${config.behavior.spinDurationMs}ms`);
        }

        function applyStaticContent(currentConfig) {
          document.title = currentConfig.content.pageTitle;
          titlePrimary.textContent = currentConfig.content.title;
          titleSecondary.textContent = currentConfig.content.subtitle;
          spinBtn.textContent = currentConfig.content.spinButtonLabel;
          emptyModalTitle.textContent = currentConfig.content.emptyStateTitle;
          reloadWheel.src = currentConfig.assets.arrowIcon;
          rouletteContainer.style.backgroundImage = `url("${escapeUrl(currentConfig.assets.wheelBackgroundImage)}")`;

          sideIcons.innerHTML = '';
          currentConfig.assets.sideIcons.forEach((iconPath, index) => {
            const img = document.createElement('img');
            img.className = 'side-icon';
            img.src = iconPath;
            img.alt = `Иконка ${index + 1}`;
            sideIcons.appendChild(img);
          });

          nameInput.value = currentConfig.participants.map((participant) => participant.name).join('\n');
          debugLog('static-content-applied', {
            title: currentConfig.content.title,
            subtitle: currentConfig.content.subtitle,
            participantCount: currentConfig.participants.length
          });
        }

        function getNamesFromInput() {
          return nameInput.value
            .split('\n')
            .map((name) => name.trim())
            .filter(Boolean);
        }

        function getSectorColors(count) {
          return Array.from(
            { length: count },
            (_, index) => config.theme.wheelSectorColors[index % config.theme.wheelSectorColors.length]
          );
        }

        function buildGradient(colors) {
          const step = 360 / colors.length;
          return `conic-gradient(${colors.map((color, index) => (
            `${color} ${step * index}deg ${step * (index + 1)}deg`
          )).join(', ')})`;
        }

        function updateWheel() {
          currentNames = getNamesFromInput();

          if (!currentNames.length) {
            wheel.style.background = 'none';
            wheel.innerHTML = '';
            debugLog('wheel-cleared-no-names');
            return;
          }

          wheel.style.background = buildGradient(getSectorColors(currentNames.length));
          wheel.style.opacity = String(config.theme.wheelOpacity);
          renderLabels(currentNames);
          debugLog('wheel-updated', {
            participantCount: currentNames.length
          });
        }

        function renderLabels(names) {
          wheel.innerHTML = '';

          if (!names.length) {
            return;
          }

          const step = 360 / names.length;
          const outerRadius = wheel.clientWidth / 2;
          const labelRadius = outerRadius * 0.8;

          names.forEach((name, index) => {
            const angle = step * index + step / 2;
            const radian = (angle - 90) * Math.PI / 180;
            const x = outerRadius + labelRadius * Math.cos(radian);
            const y = outerRadius + labelRadius * Math.sin(radian);
            const participant = participantDirectory.get(name);
            const iconValue = participant && participant.icon ? participant.icon : DEFAULT_EMOJIS[index % DEFAULT_EMOJIS.length];
            const label = document.createElement('div');
            const nameNode = document.createElement('span');

            label.className = 'sector-label';
            label.style.top = `${y}px`;
            label.style.left = `${x}px`;
            label.style.transform = `translate(-50%, -50%) rotate(${angle - 90}deg)`;

            if (looksLikeImage(iconValue)) {
              const iconImage = document.createElement('img');
              iconImage.className = 'sector-label-image';
              iconImage.src = iconValue;
              iconImage.alt = name;
              label.appendChild(iconImage);
            } else {
              const iconNode = document.createElement('span');
              iconNode.className = 'sector-label-icon';
              iconNode.textContent = iconValue;
              label.appendChild(iconNode);
            }

            nameNode.className = 'sector-label-name';
            nameNode.textContent = name;
            label.appendChild(nameNode);
            wheel.appendChild(label);
          });
        }

        function getWinnerIndex() {
          const step = 360 / currentNames.length;
          const normalized = (currentRotation % 360 + 360) % 360;
          return Math.floor(((360 - normalized) % 360) / step);
        }

        function getWinnerImage() {
          const fallbackImages = config.assets.fallbackWinnerImages;
          if (!fallbackImages.length) {
            return '';
          }

          if (!unusedWinnerImageIndexes.length) {
            unusedWinnerImageIndexes = Array.from({ length: fallbackImages.length }, (_, index) => index);
          }

          const randomIndex = Math.floor(Math.random() * unusedWinnerImageIndexes.length);
          const fallbackIndex = unusedWinnerImageIndexes.splice(randomIndex, 1)[0];
          return fallbackImages[fallbackIndex];
        }

        function showModal(name) {
          const winnerImage = getWinnerImage();
          winnerNameEl.textContent = name;
          winnerGif.src = winnerImage;
          winnerGif.style.display = winnerImage ? 'block' : 'none';
          modal.style.display = 'flex';
          debugLog('winner-modal-opened', {
            winner: name,
            winnerImage
          });

          window.setTimeout(() => {
            modal.style.display = 'none';
          }, config.behavior.winnerModalDurationMs);
        }

        function launchFireworks() {
          for (let index = 0; index < 10; index += 1) {
            const firework = document.createElement('div');
            const size = 4 + Math.random() * 6;
            const colorIndex = Math.floor(Math.random() * config.theme.winnerFireworkColors.length);

            firework.className = 'firework';
            firework.style.cssText = [
              `width:${size}px`,
              `height:${size}px`,
              `background:${config.theme.winnerFireworkColors[colorIndex]}`,
              `top:${Math.random() * window.innerHeight}px`,
              `left:${Math.random() * window.innerWidth}px`,
              `--tx:${Math.random() * 200 - 100}px`,
              `--ty:${Math.random() * 200 - 100}px`
            ].join(';');

            document.body.appendChild(firework);
            window.setTimeout(() => firework.remove(), 1000);
          }
        }

        function launchButtonFireworks() {
          const rect = spinBtn.getBoundingClientRect();

          for (let index = 0; index < 6; index += 1) {
            const firework = document.createElement('div');
            const size = 6 + Math.random() * 6;
            const angle = (360 / 6) * index;
            const radius = 50 + Math.random() * 10;
            const radian = angle * Math.PI / 180;
            const tx = Math.cos(radian) * radius + (Math.random() * 20 - 10);
            const ty = Math.sin(radian) * radius + (Math.random() * 20 - 10);
            const colorIndex = Math.floor(Math.random() * config.theme.buttonFireworkColors.length);

            firework.className = 'btn-firework';
            firework.style.cssText = [
              `width:${size}px`,
              `height:${size}px`,
              `background:${config.theme.buttonFireworkColors[colorIndex]}`,
              'position:fixed',
              `left:${rect.left + rect.width / 2}px`,
              `top:${rect.top + rect.height / 2}px`,
              `--tx:${tx}px`,
              `--ty:${ty}px`
            ].join(';');

            document.body.appendChild(firework);
            window.setTimeout(() => firework.remove(), 800);
          }
        }

        function spinWheel() {
          debugLog('spin-requested', {
            isSpinning,
            namesInTextarea: getNamesFromInput().length
          });

          if (isSpinning) {
            debugLog('spin-ignored-already-spinning');
            return;
          }

          currentNames = getNamesFromInput();
          if (!currentNames.length) {
            emptyModal.style.display = 'flex';
            debugLog('spin-blocked-no-names');
            window.setTimeout(() => {
              emptyModal.style.display = 'none';
            }, config.behavior.emptyModalDurationMs);
            return;
          }

          isSpinning = true;
          const step = 360 / currentNames.length;
          const duration = window.innerWidth <= 768
            ? config.behavior.mobileSpinDurationMs
            : config.behavior.spinDurationMs;

          fixedAngleStep = (fixedAngleStep + 1) % currentNames.length;

          const targetRotation = config.behavior.fullSpins * 360
            + (360 - fixedAngleStep * step - step / 2);

          debugLog('spin-started', {
            currentNamesCount: currentNames.length,
            step,
            duration,
            fixedAngleStep,
            targetRotation
          });

          document.documentElement.style.setProperty('--spin-duration', `${duration}ms`);
          launchButtonFireworks();
          spinSound.currentTime = 0;
          spinSound.play().catch(() => {});
          wheel.style.transition = `transform ${duration}ms cubic-bezier(0.33, 1, 0.68, 1)`;
          wheel.style.transform = `rotate(${targetRotation}deg)`;

          const onTransitionEnd = () => {
            wheel.removeEventListener('transitionend', onTransitionEnd);
            currentRotation = targetRotation % 360;

            const winnerIndex = getWinnerIndex();
            if (winnerIndex !== -1) {
              const winner = currentNames[winnerIndex];
              debugLog('winner-selected', {
                winner,
                winnerIndex,
                namesBeforeRemoval: currentNames.length
              });
              launchFireworks();
              currentNames.splice(winnerIndex, 1);
              nameInput.value = currentNames.join('\n');
              updateWheel();
              spinSound.pause();
              showModal(winner);
            }

            isSpinning = false;
            wheel.style.transition = 'none';
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            debugLog('spin-finished', {
              currentRotation,
              remainingNames: currentNames.length
            });
          };

          wheel.addEventListener('transitionend', onTransitionEnd);
        }
      }

      function debugLog(eventName, details, level) {
        const logLevel = level || 'log';
        const payload = details || {};

        if (typeof console[logLevel] === 'function') {
          console[logLevel](`[wheel] ${eventName}`, payload);
        } else {
          console.log(`[wheel] ${eventName}`, payload);
        }

        sendDebugPing(eventName, payload, logLevel);
      }

      function sendDebugPing(eventName, details, level) {
        try {
          const params = new URLSearchParams({
            ts: new Date().toISOString(),
            level: level || 'log',
            event: eventName
          });

          Object.entries(details || {}).forEach(([key, value]) => {
            params.set(key, describeDebugValue(value));
          });

          fetch(`${DEBUG_PING_PATH}?${params.toString()}`, {
            cache: 'no-store'
          }).catch(() => {});
        } catch (error) {
          console.error('[wheel] debug-ping-failed', error);
        }
      }

      function describeDebugValue(value) {
        if (value === null || value === undefined) {
          return String(value);
        }

        if (typeof value === 'object') {
          try {
            return JSON.stringify(value).slice(0, 200);
          } catch (error) {
            return '[unserializable-object]';
          }
        }

        return String(value).slice(0, 200);
      }

      function normalizeConfig(inputConfig) {
        const normalizedParticipants = Array.isArray(inputConfig.participants) && inputConfig.participants.length
          ? inputConfig.participants
              .map(normalizeParticipant)
              .filter(Boolean)
          : [
              normalizeParticipant({ name: 'Анастасия', icon: '📚' }),
              normalizeParticipant({ name: 'Диана', icon: '🌊' }),
              normalizeParticipant({ name: 'Мария MariKo', icon: '🐚' }),
              normalizeParticipant({ name: 'Тимофей', icon: '⭐' }),
              normalizeParticipant({ name: 'Светлана', icon: '🪄' })
            ];

        return {
          content: {
            pageTitle: getString(inputConfig.content && inputConfig.content.pageTitle, 'Книжная Рулетка'),
            title: getString(inputConfig.content && inputConfig.content.title, 'book club'),
            subtitle: getString(inputConfig.content && inputConfig.content.subtitle, 'what do seashells sing about'),
            spinButtonLabel: getString(inputConfig.content && inputConfig.content.spinButtonLabel, 'go go go'),
            emptyStateTitle: getString(inputConfig.content && inputConfig.content.emptyStateTitle, '🎊 ВСЁ! 🎊')
          },
          theme: {
            background: getString(inputConfig.theme && inputConfig.theme.background, '#e8edef'),
            primaryLight: getString(inputConfig.theme && inputConfig.theme.primaryLight, '#5393fb'),
            primary: getString(inputConfig.theme && inputConfig.theme.primary, '#5393fb'),
            primaryDark: getString(inputConfig.theme && inputConfig.theme.primaryDark, '#5393fb'),
            textLight: getString(inputConfig.theme && inputConfig.theme.textLight, '#ffffff'),
            textDark: getString(inputConfig.theme && inputConfig.theme.textDark, '#8c909d'),
            textShell: getString(inputConfig.theme && inputConfig.theme.textShell, '#2b211f'),
            grayShell: getString(inputConfig.theme && inputConfig.theme.grayShell, '#2b211f'),
            accentLight: getString(inputConfig.theme && inputConfig.theme.accentLight, '#5b71ff'),
            accentDark: getString(inputConfig.theme && inputConfig.theme.accentDark, '#2b42d4'),
            wheelOpacity: typeof inputConfig.theme?.wheelOpacity === 'number'
              ? inputConfig.theme.wheelOpacity
              : 0.9,
            wheelSectorColors: normalizeStringArray(inputConfig.theme && inputConfig.theme.wheelSectorColors, [
              '#f8d7da',
              '#fde2b8',
              '#fff9c4',
              '#d7f9ee',
              '#d6eaff',
              '#e4d7f9',
              '#f5e6cc',
              '#ffe4ec',
              '#e8f5e9'
            ]),
            winnerFireworkColors: normalizeStringArray(inputConfig.theme && inputConfig.theme.winnerFireworkColors, [
              '#F9E0AE',
              '#F4BFBF',
              '#FFD6A5',
              '#FFF7AE',
              '#C8E3D4',
              '#AEE1E1',
              '#BFD7ED',
              '#E5C1CD',
              '#D2DAFF',
              '#FFFFFF'
            ]),
            buttonFireworkColors: normalizeStringArray(
              inputConfig.theme && inputConfig.theme.buttonFireworkColors,
              ['gold', 'orange', 'yellow', 'red']
            )
          },
          assets: {
            arrowIcon: getString(inputConfig.assets && inputConfig.assets.arrowIcon, './assets/book-club/shell-arrow.svg'),
            wheelBackgroundImage: getString(
              inputConfig.assets && inputConfig.assets.wheelBackgroundImage,
              './assets/book-club/wheel-background-image.svg'
            ),
            sideIcons: normalizeStringArray(
              inputConfig.assets && inputConfig.assets.sideIcons,
              ['./assets/book-club/shells.svg', './assets/book-club/shells.svg'],
              true
            ),
            fallbackWinnerImages: normalizeStringArray(
              inputConfig.assets && inputConfig.assets.fallbackWinnerImages,
              DEFAULT_WINNER_IMAGES,
              true
            )
          },
          participants: normalizedParticipants,
          behavior: {
            fullSpins: getPositiveNumber(inputConfig.behavior && inputConfig.behavior.fullSpins, 5),
            spinDurationMs: getPositiveNumber(inputConfig.behavior && inputConfig.behavior.spinDurationMs, 5000),
            mobileSpinDurationMs: getPositiveNumber(
              inputConfig.behavior && inputConfig.behavior.mobileSpinDurationMs,
              3000
            ),
            winnerModalDurationMs: getPositiveNumber(
              inputConfig.behavior && inputConfig.behavior.winnerModalDurationMs,
              7000
            ),
            emptyModalDurationMs: getPositiveNumber(
              inputConfig.behavior && inputConfig.behavior.emptyModalDurationMs,
              2000
            )
          }
        };
      }

      function normalizeParticipant(participant) {
        if (typeof participant === 'string') {
          const nameValue = participant.trim();
          return nameValue ? { name: nameValue, icon: '' } : null;
        }

        if (!participant || typeof participant !== 'object') {
          return null;
        }

        const nameValue = getString(participant.name, '').trim();
        if (!nameValue) {
          return null;
        }

        return {
          name: nameValue,
          icon: getString(participant.icon, '')
        };
      }

      function normalizeStringArray(value, fallback, allowEmpty) {
        if (!Array.isArray(value)) {
          return fallback.slice();
        }

        const normalized = value
          .map((item) => getString(item, '').trim())
          .filter(Boolean);

        if (!normalized.length && !allowEmpty) {
          return fallback.slice();
        }

        return normalized;
      }

      function getString(value, fallback) {
        return typeof value === 'string' ? value : fallback;
      }

      function getPositiveNumber(value, fallback) {
        return typeof value === 'number' && value > 0 ? value : fallback;
      }

      function escapeUrl(value) {
        return String(value).replace(/"/g, '&quot;');
      }

      function looksLikeImage(value) {
        return /^(https?:\/\/|\.\/|\/|data:image\/|file:\/\/)/i.test(value)
          || /\.(png|jpe?g|gif|svg|webp)$/i.test(value);
      }
     }());
</script>
