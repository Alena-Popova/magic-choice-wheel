<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Книжная Рулетка</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://fonts-online.ru/fonts/unifix-sp" rel="stylesheet">

    <style>
        @font-face {
          font-family: 'UnifixSP';
          src: url('./UnifixSP/UnifixSPDemo.otf') format('opentype');
          font-weight: 400;
          font-style: normal;
        }
        :root {
          --background: #e8edef;
          --primary-light: #5393fb;
          --primary: #5393fb;
          --color-text-light: #fff;
          --primary-dark: #5393fb;
          --color-text-dark: #8c909d;
          --color-text-shell: #2b211f;

          --color-gray-shell: #2b211f;
          --color-light-violet: #5B71FF;
          --color-deep-violet: #2B42D4;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
        }
        body {
          margin: 0;
          background: var(--background);
          font-family: 'UnifixSP', sans-serif;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .page {
            display: block;
            align-items: center;
        }
        .title {
            margin: 20px;
            text-align: center;
            font-size: 2rem;
            margin-bottom: 60px;
        }
        .wrapper {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 2rem;
          padding-top: 2rem;
          user-select: none;
        }
        #rouletteContainer {
          position: relative;
          width: 600px;
          height: 600px;
          border-radius: 50%;
          margin: 0 auto;
          overflow: visible;
          border: 3px solid var(--color-light-violet);
          background-image: url('./wheel-background-image.svg');
          background-size: cover;         /* ✅ заполняет весь круг */
          background-position: center;    /* ✅ центрирует */
          background-repeat: no-repeat;   /* ✅ без повторов */
        }
        #rouletteContainer::before {
          content: '';
          position: absolute;
          inset: -12px; /* расстояние от внешнего края */
          border-radius: 50%;
          border: 3px solid var(--color-light-violet);
          pointer-events: none;
        }
        #wheel {
          position: relative;         /* Позволяет позиционировать внутренние элементы относительно колеса */
          width: 100%;                /* Колесо растягивается на всю ширину контейнера */
          height: 100%;               /* И по высоте тоже */
          border-radius: 50%;         /* Делает элемент круглым */
          transition: transform 5s cubic-bezier(0.33, 1, 0.68, 1); /* Анимация вращения */
          will-change: transform;     /* Подсказка браузеру оптимизировать вращение (ускорение) */
        }
        .sector-label {
          position: absolute;
          font-weight: bold;
          font-size: 1.4rem;
          pointer-events: none;
          user-select: none;
          white-space: pre;       /* учитываем переносы \n */
          text-align: center;     /* имя под эмодзи центрируется */
          line-height: 1.8;       /* увеличиваем расстояние между строками */
          /* Пишем вертикально, но убираем направление rtl */
          writing-mode: vertical-lr;
          text-orientation: mixed;
          transform-origin: center center;
          color: var(--color-deep-violet);
        }
        #arrow {
          width: 0;
          height: 0;
          position: absolute;
          top: -70px;
          left: 50%;
          margin-left: -50px;
          z-index: 10;
        }
        #arrow img {
          width: 100px;
          height: 100px;
        }
        .side-panel {
          flex: 1 1 30%;
          max-width: 400px;
          display: flex;
          flex-direction: column;
          gap: 1rem;
          justify-content: flex-start;
          align-items: center;
          margin: 2rem auto;
          min-width: 320px;
        }
        #nameInput {
          width: 100%;
          height: 150px;
          font-size: 1rem;
          padding: 1rem;
          border-radius: 10px;
          resize: none;
          margin-bottom: 1.5rem;
          color: var(--color-text-shell);
          background: var(--background);
          border: 3px solid var(--color-light-violet);
          font-family: 'UnifixSP', sans-serif;
        }
        #spinBtn {
          position: relative;
          padding: 1rem 2rem;
          font-size: 1.5rem;
          border: none;
          border-radius: 12px;
          cursor: pointer;
          width: 100%;
          overflow: visible;
          transition: transform 0.2s ease, box-shadow 0.3s ease;
          z-index: 0;
          user-select: none;
          color: var(--background);
          background: var(--color-light-violet);
          font-family: 'UnifixSP', sans-serif;
        }
        #spinBtn:hover {
          transform: scale(1.05);
        }
        #spinBtn:active {
          transform: scale(0.95);
        }
        /* Анимация фейерверка кнопки */
        .btn-firework {
          position: absolute;
          border-radius: 50%;
          pointer-events: none;
          animation: btnExplode 800ms ease-out forwards;
          opacity: 1;
          will-change: transform, opacity;
          z-index: 10;
          background-color: var(--primary-dark);
        }
        @keyframes btnExplode {
          0% {
            transform: scale(1);
            opacity: 1;
          }
          100% {
            transform: scale(3) translate(var(--tx), var(--ty));
            opacity: 0;
          }
        }
        /* Фейерверки после выигрыша */
        .firework {
          position: fixed;
          border-radius: 50%;
          pointer-events: none;
          animation: explode 1s ease-out forwards;
          opacity: 1;
          z-index: 9999;
          will-change: transform, opacity;
        }
        @keyframes explode {
          0% {
            transform: scale(1);
            opacity: 1;
          }
          100% {
            transform: scale(20) translate(var(--tx), var(--ty));
            opacity: 0;
          }
        }
        .modal {
          position: fixed;
          top: 0; left: 0;
          width: 100%; height: 100%;
          background: rgba(0, 0, 0, 0.9);
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          z-index: 9999;
          display: none;
        }
        .modal h2 {
          font-size: 3rem;
          margin-bottom: 1rem;
          color: var(--color-text-dark);
        }
        .modal img {
          width: 400px;
          max-width: 90%;
          height: auto;
          border: 5px solid var(--color-text-dark);
          border-radius: 15px;
        }
        @media (max-width: 768px) {
          .wrapper {
            flex-direction: column;
            align-items: center;
          }
          #rouletteContainer, .side-panel {
            width: 100%;
            max-width: 100%;
          }
          #rouletteContainer {
            height: 90vw;
            width: 90vw;
          }
          #wheel {
            transition: transform 3s cubic-bezier(0.33, 1, 0.68, 1);
          }
        }

        .container-one-by-one-row {
         display: flex;
         justify-content: center;
         align-items: center;
         gap: 8px;
       }
    </style>
</head>
<body>
<div class="page">
    <div class="title">
        <div style="color: var(--color-deep-violet);">
            book club
        </div>
        <div style="color: var(--color-light-violet);">
            what do seashells sing about
        </div>
    </div>
    <div class="wrapper">
        <div id="rouletteContainer">
            <div id="arrow">
                <img id="reloadWheel" src="./shell-arrow.svg" />
            </div>
            <div id="wheel"></div>
        </div>
        <div class="side-panel">
            <div class="container-one-by-one-row">
                <div>
                    <img style="width: 200px;" src="./shells.svg" />
                </div>
                <div>
                    <img style="width: 200px;" src="./shells.svg" />
                </div>
            </div>
        <textarea style="width: 408px;" id="nameInput">
        Анастасия
        Диана
        Мария MariKo
        Тимофей
        Светлана
        </textarea>
        <button id="spinBtn">go go go</button>
        </div>
    </div>
    <div class="modal" id="winnerModal" style="display: none;">
        <h2 id="winnerName">Алена</h2>
        <img id="winnerGif"
             src="https://media3.giphy.com/media/v1.Y2lkPTlhMmQ0YjA4cmNoajA1aGN6bXMwNHc4aDFlbTJybmh1aDAyeTN0NG5ucGV1eHR6eiZlcD12MV9naWZzX3JhbmRvbSZjdD1n/JSXQ5I5o5ET5nerztu/giphy.gif"
             alt="GIF" style="opacity: 1;">
    </div>
    <div class="modal" id="emptyModal">
        <h2>🎊 ВСЁ! 🎊</h2>
    </div>
    <audio id="spinSound" src="https://cdn.freesound.org/previews/59/59194_745228-lq.mp3"></audio>
</div>
<script>
    $(function() {
      // ====================== КОНСТАНТЫ ======================
      const EMOJIS = [
        '📚','📖','🕮','📜','✒️','🖋️','📔','📘','📙','📗',
        '📓','📒','📑','🔖','🪶','🕯️','☕','🍵','📎','✉️',
        '💭','🌙','⭐','🪄','🧠','💡','🎇','🪞','🕰️','🏛️',
        '🌿','🍂','🌸','🪶','📇','🗝️','📦','📷','🎵','🗒️'
      ];
      const BASE_COLORS = ['#a020f0','#ff0066','#ff8c00','#00bfff','#00ff7f','#ff4500','#9acd32','#ff1493'];
      const DEFAULT_GIF = 'https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif';
      const MAX_GIFS = 3; // сколько гифок держим в кеше

      // ====================== DOM ЭЛЕМЕНТЫ ======================
      const $wheel = $('#wheel');
      const $spinBtn = $('#spinBtn');
      const $reloadWheel = $('#reloadWheel');
      const nameInput = document.getElementById('nameInput');
      const modal = document.getElementById('winnerModal');
      const emptyModal = document.getElementById('emptyModal');
      const winnerNameEl = document.getElementById('winnerName');
      const winnerGif = document.getElementById('winnerGif');
      const spinSound = document.getElementById('spinSound');
      const autoSpin = document.getElementById('autoSpin');
      const toggleSettings = document.getElementById('toggleSettingsBtn');
      const GIF_COUNT = 34; // 👉 тут укажи реальное количество гифок
      const GIF_PATH = './gifs/';
      // ====================== ПЕРЕМЕННЫЕ ======================
      let currentNames = [];
      let isSpinning = false;
      let currentRotation = 0;
      let fixedAngleStep = 0;
      let unusedIndexes = [];

      // для кеширования гифок
      const preloadedGifs = []; // содержит объекты Image
      let preloadingInProgress = false;

      // ====================== ФУНКЦИИ: УЧАСТНИКИ ======================
      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function getColors(count) {
        const pastelPalette = [
            '#f8d7da', // розовый
            '#fde2b8', // персиковый
            '#fff9c4', // лимонный крем
            '#d7f9ee', // мятный
            '#d6eaff', // нежно-голубой
            '#e4d7f9', // сиреневый
            '#f5e6cc', // песочный
            '#ffe4ec', // розовый чай
            '#e8f5e9', // светло-зелёный
        ];
        return Array.from({ length: count }, (_, i) => pastelPalette[i % pastelPalette.length]);
      }

      function buildGradient(colors) {
        const step = 360 / colors.length;
        return `conic-gradient(${colors.map((c,i)=>`${c} ${step*i}deg ${step*(i+1)}deg`).join(', ')})`;
      }

      function renderLabels(names) {
        $wheel.find('.sector-label').remove();
        if (!names || !names.length) return;

        const step = 360 / names.length;
        const outerRadius = $wheel.width() / 2;
        const labelRadius = outerRadius * 0.8;

        names.forEach((name,i)=>{
          const angle = step*i + step/2;
          const rad = (angle-90)*Math.PI/180;
          const x = outerRadius + labelRadius * Math.cos(rad);
          const y = outerRadius + labelRadius * Math.sin(rad);
          const emoji = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
          $('<div class="sector-label"></div>')
            .text(`${emoji}\n${name}`)
            .css({top: y+'px', left: x+'px', transform: `translate(-50%,-50%) rotate(${angle-90}deg)`})
            .appendTo($wheel);
        });
      }

      function updateWheel() {
        currentNames = nameInput.value.split('\n').map(n => n.trim()).filter(n => n);
        if (!currentNames.length) {
          $wheel.css('background','none');
          $wheel.find('.sector-label').remove();
          return;
        }
        $wheel.css('background', buildGradient(getColors(currentNames.length)));
        $wheel.css('opacity', '0.9');
        renderLabels(currentNames);
      }

      // ====================== ФУНКЦИИ: ПОДГРУЗКА GIF (CACHE) ======================

      // Берёт следующую гифку из очереди; запускает подгрузку ещё одной, если нужно.
      function getNextGif() {
        // если все гифки уже использованы, сбрасываем список
        if (unusedIndexes.length === 0) {
          unusedIndexes = Array.from({ length: GIF_COUNT }, (_, i) => i + 1);
        }

        // выбираем случайный индекс
        const randomIndex = Math.floor(Math.random() * unusedIndexes.length);
        const gifNumber = unusedIndexes.splice(randomIndex, 1)[0]; // удаляем, чтобы не повторялся

        return `${GIF_PATH}${gifNumber}.gif`;
      }

      // ====================== ФУНКЦИИ: МОДАЛЬНЫЕ ОКНА ======================
      function showModal(name) {
        winnerNameEl.textContent = name;
        modal.style.display = 'flex';

        // Берём готовую гифку из кеша (если есть) — это мгновенно (img.src уже задан)
        const gifUrl = getNextGif();
        winnerGif.src = gifUrl;
        winnerGif.style.opacity = 1;

        setTimeout(() => { modal.style.display = 'none'; }, 7000);
      }

      // ====================== ФУНКЦИИ: ВРАЩЕНИЕ ======================
      function getWinnerIndex() {
        const step = 360 / currentNames.length;
        const normalized = (currentRotation % 360 + 360) % 360;
        return Math.floor(((360 - normalized) % 360) / step);
      }

      function launchFireworks() {
        const colors = [
          '#F9E0AE', // тёплый песочный
          '#F4BFBF', // розовый дым
          '#FFD6A5', // персик
          '#FFF7AE', // ваниль
          '#C8E3D4', // мятный
          '#AEE1E1', // морская пена
          '#BFD7ED', // голубой туман
          '#E5C1CD', // пудрово-розовый
          '#D2DAFF', // лаванда
          '#FFFFFF'  // белый акцент
        ];
        for (let i = 0; i < 10; i++) {
          const fw = document.createElement('div');
          fw.className = 'firework';
          const size = 4 + Math.random() * 6;
          fw.style.cssText = `width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};top:${Math.random()*window.innerHeight}px;left:${Math.random()*window.innerWidth}px;--tx:${Math.random()*200-100}px;--ty:${Math.random()*200-100}px;`;
          document.body.appendChild(fw);
          setTimeout(()=>fw.remove(), 1000);
        }
      }

      function launchButtonFireworks() {
        const colors = ['gold','orange','yellow','red'];
        const rect = $spinBtn[0].getBoundingClientRect();
        for (let i = 0; i < 6; i++) {
          const fw = document.createElement('div');
          fw.className = 'btn-firework';
          const size = 6 + Math.random() * 6;
          const angle = (360/6) * i;
          const radius = 50 + Math.random() * 10;
          const rad = (angle * Math.PI) / 180;
          const tx = Math.cos(rad) * radius + (Math.random() * 20 - 10);
          const ty = Math.sin(rad) * radius + (Math.random() * 20 - 10);
          fw.style.cssText = `width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};position:fixed;left:${rect.left+rect.width/2}px;top:${rect.top+rect.height/2}px;--tx:${tx}px;--ty:${ty}px;`;
          document.body.appendChild(fw);
          setTimeout(()=>fw.remove(), 800);
        }
      }

      function spinWheel() {
        if (isSpinning) return;
        currentNames = nameInput.value.split('\n').map(n => n.trim()).filter(n => n);
        if (!currentNames.length) {
          emptyModal.style.display = 'flex';
          setTimeout(()=>emptyModal.style.display='none', 2000);
          return;
        }

        isSpinning = true;
        const step = 360 / currentNames.length;
        fixedAngleStep = (fixedAngleStep + 1) % currentNames.length;
        const spins = 5;
        const targetRotation = spins * 360 + (360 - fixedAngleStep * step - step/2);

        launchButtonFireworks();
        spinSound.currentTime = 0;
        spinSound.play();
        $wheel.css({transition:'transform 5s cubic-bezier(0.33,1,0.68,1)', transform: `rotate(${targetRotation}deg)`});

        $wheel.one('transitionend', ()=>{
          currentRotation = targetRotation % 360;
          const winnerIndex = getWinnerIndex();
          if (winnerIndex !== -1) {
            const winner = currentNames[winnerIndex];
            launchFireworks();
            currentNames.splice(winnerIndex, 1);
            nameInput.value = currentNames.join('\n');
            updateWheel();
            spinSound.pause();

            // Показ модалки — берём гифку из кеша
            showModal(winner);
          }
          isSpinning = false;
          $wheel.css({transition:'none', transform: `rotate(${currentRotation}deg)`});
        });
      }

      // ====================== ОБРАБОТЧИКИ СОБЫТИЙ ======================
      $spinBtn.on('click', spinWheel);
      $reloadWheel.on('click', updateWheel);
      modal.addEventListener('click', ()=> modal.style.display = 'none');
      emptyModal.addEventListener('click', ()=> emptyModal.style.display = 'none');

      // ====================== ИНИЦИАЛИЗАЦИЯ ======================
      // Перемешиваем начальный список
      const shuffledNames = shuffleArray(nameInput.value.split('\n').map(n => n.trim()).filter(n => n));
      nameInput.value = shuffledNames.join('\n');

      // Настраиваем круг и wheel
      updateWheel();

      // Подгружаем несколько гифок заранее (если есть участники)
      currentNames = nameInput.value.split('\n').map(n => n.trim()).filter(n => n);
    });
</script>
</body>
</html>
